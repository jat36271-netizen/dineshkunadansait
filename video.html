<!DOCTYPE html>
<html>
<head>
<title>Video Page</title>

<style>
body{
background:black;
color:white;
text-align:center;
font-family:Arial;
padding-top:80px;
}

video{
width:80%;
max-width:700px;
border-radius:10px;
}

button{

color:white;

}

</head>

<body>

<h1>Watch Video</h1>

<video controls>
<source src="video.mp4" type="video/mp4">
</video>

<br>

<button>Download Video</button>

</body>
</html>
